<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreaterOrLess</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-700">
    <div class="flex justify-between bg-slate-200 p-4">
        <h1 class="text-3xl font-bold">Mini Challenge-Greater Than Or Less Than</h1>
        <a href="index.html" class="text-2xl underline">Home</a>
    </div>
   <form id="compare-form">
    <input id="num1" type="number"  class="flex bg-white p-2 w-80 mx-auto my-5" placeholder="Enter Your First Number" required>
    <input id="num2" type="number"  class="flex bg-white p-2 w-80 mx-auto my-5" placeholder="Enter Your Second Number" required>
    <button type="submit" class="flex bg-white p-2 w-20 rounded-lg font-semibold mx-auto my-5" >Submit</button>
    </form>
    <p id="gnum-output" class="flex italic text-slate-200 p-2 justify-center my-5">No Numbers input</p>
    <p id="gnum-output-two" class="flex  text-slate-200 p-2 justify-center my-5"></p>
    <script src="./js/app.js"></script>
</body>

</html>
