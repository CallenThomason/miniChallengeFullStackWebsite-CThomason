<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestuarantPicker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-700">
    <div class="flex justify-between bg-slate-200 p-4">
        <h1 class="text-3xl font-bold">Mini Challenge-Restuarant Picker</h1>
        <a href="index.html" class="text-2xl underline">Home</a>
    </div>
   <form id="restaurant-form" >

    <select id="restuarant-input"   class="flex bg-white p-2 w-80 mx-auto my-5" placeholder="text-body">
        <!-- <option selected>What sounds good</option> -->
        <option value="burger">Burgers</option>
        <option value="mexican">Mexican</option>
        <option value="chinese">Chinese</option>

    </select>
    <button  type="submit" class="flex bg-white p-2 w-20 rounded-lg font-semibold mx-auto my-5" >Submit</button>
    </form>
    <p  id="restuarant-output" class="flex italic text-slate-200 p-2 justify-center my-5">Let me decide where you eat today!</p>
    <script src="./js/app.js"></script>
</body>

</html>
