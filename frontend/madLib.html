<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MadLib</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-700">
    <div class="flex justify-between bg-slate-200 p-4">
        <h1 class="text-3xl font-bold">Mini Challenge-Mad Lib</h1>
        <a href="index.html" class="text-2xl underline">Home</a>
    </div>
    <form id="mad-form">
        <div class="grid grid-cols-2 max-w-2xl mx-auto center place-items-center">
            <input id="mad-name-input" type="text" class="flex bg-white p-2 w-40  my-5" placeholder="Enter A Name"
                required>
            <input id="animal-input" type="text" class="flex bg-white p-2 w-40  my-5" placeholder="Enter An Animal"
                required>
            <input id="another-input" type="text" class="flex bg-white p-2 w-40  my-5" placeholder="Enter Another Name"
                required>
            <input id="mad-num-input" type="number" class="flex bg-white p-2 w-40 my-5" placeholder="Enter A Number"
                required>
            <input id="noun-input" type="text" class="flex bg-white p-2 w-40  my-5" placeholder="Enter A Noun"
                required>
            <input id="color-input" type="text" class="flex bg-white p-2 w-40  my-5" placeholder="Enter A Color"
                required>
            <input id="verb-input" type="text" class="flex bg-white p-2 w-40  my-5" placeholder="Enter A Verb"
                required>
            <input id="place-input" type="text" class="flex bg-white p-2 w-40  my-5" placeholder="Enter A Place"
                required>
            <input id="adj-input" type="text" class="flex bg-white p-2 w-40  my-5" placeholder="Enter An Adjective"
                required>
            <input id="food-input" type="text" class="flex bg-white p-2 w-40  my-5" placeholder="Enter A Food"
                required>
            </div>
            <button type="submit" class="flex bg-white p-2 w-20 rounded-lg font-semibold mx-auto my-5">Submit</button>
        
    </form>
    <p id="mad-output" class="flex italic text-slate-200 p-2 justify-center my-5">No Name input</p>
    <script src="./js/app.js"></script>
</body>

</html>
